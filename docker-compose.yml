version: "3.9"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  StayNest — Full-Stack Airbnb-like App
#  Services: frontend (nginx) | backend (node) | mongo
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:

  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: staynest-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: staynest
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - staynest-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (Node/Express) ────────────────────────────────
  backend:
    image: swapnilmali101/staynest-backend
    container_name: staynest-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://staynest_user:staynest_pass@mongo:27017/staynest?authSource=staynest
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - staynest-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Seed (one-shot job) ───────────────────────────────────
  seed:
    image: swapnilmali101/staynest-seed
    container_name: staynest-seed
    environment:
      MONGO_URI: mongodb://staynest_user:staynest_pass@mongo:27017/staynest?authSource=staynest
    command: ["node", "seed/seed.js"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - staynest-net
    restart: "no"

  # ── Frontend (Nginx) ──────────────────────────────────────
  frontend:
    image: swapnilmali101/staynest-frontend
    container_name: staynest-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - staynest-net

# ── Volumes & Networks ────────────────────────────────────
volumes:
  mongo_data:
    driver: local

networks:
  staynest-net:
    driver: bridge
